  <meta name="keywords" content="联系,商务合作,产品建议,媒体采访,科技工作室" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="联系我们 · Nullspace Studio" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">跳转到主要内容</a>

  <!-- ===================== Navigation ===================== -->
  <header class="nav" id="nav" data-state="scrolled">
    <div class="nav__inner">
      <a class="nav__logo" href="index.html" aria-label="Nullspace Studio 首页">
        <svg class="nav__logo-mark" width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M9 22 L16 9 L23 22" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="nav__logo-text">Nullspace</span>
      </a>
      <nav class="nav__links" aria-label="主导航">
        <a class="nav__link" href="index.html">首页</a>
        <a class="nav__link" href="products.html">产品矩阵</a>
        <a class="nav__link" href="about.html">技术理念</a>
        <a class="nav__link" href="about.html#team">关于我们</a>
        <a class="nav__link" href="contact.html">联系我们</a>
      </nav>
      <a class="nav__cta btn btn--ghost" href="index.html#subscribe">订阅动态</a>
      <button class="nav__burger" id="navBurger" aria-label="打开菜单" aria-expanded="false" aria-controls="navMobile">
        <span></span><span></span><span></span>

    </div>
    <div class="nav__mobile" id="navMobile" aria-hidden="true">
      <a class="nav__mobile-link" href="index.html">首页</a>
      <a class="nav__mobile-link" href="products.html">产品矩阵</a>
      <a class="nav__mobile-link" href="about.html">技术理念</a>
      <a class="nav__mobile-link" href="about.html#team">关于我们</a>
      <a class="nav__mobile-link" href="contact.html">联系我们</a>
      <a class="btn btn--solid nav__mobile-cta" href="index.html#subscribe">订阅动态</a>
    </div>
  </header>

  <main id="main">
    <section class="contact">
      <div class="contact__head">
        <p class="subscribe__eyebrow" data-reveal>GET IN TOUCH</p>
        <h1 class="contact__title" data-reveal data-reveal-delay="1">聊聊吧</h1>
        <p class="contact__desc" data-reveal data-reveal-delay="2">
          商务洽谈、产品建议、媒体采访——<br class="hide-sm" />
          告诉我们你的想法,我们会认真回复每一封留言。
        </p>
      </div>

      <form class="form" id="contactForm" novalidate data-reveal data-reveal-delay="2">
        <div class="form__field field">
          <input class="field__input" id="cf-name" name="name" type="text" autocomplete="name" placeholder=" " required />
          <label class="field__label" for="cf-name">姓名</label>
        </div>

        <div class="form__field field">
          <input class="field__input" id="cf-email" name="email" type="email" inputmode="email" autocomplete="email" placeholder=" " required />
          <label class="field__label" for="cf-email">邮箱</label>
        </div>

        <div class="form__field field">
          <textarea class="field__textarea" id="cf-message" name="message" placeholder=" " required></textarea>
          <label class="field__label" for="cf-message">留言</label>
        </div>

        <button class="btn btn--solid form__submit" type="submit">发送留言</button>
      </form>

      <div class="social" data-reveal data-reveal-delay="3">
        <a class="social__link" href="https://github.com" aria-label="GitHub" rel="noopener" target="_blank">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.2-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2 1-.3 2-.4 3-.4s2 .1 3 .4c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8.1 3.1.8.9 1.2 1.9 1.2 3.2 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/>
          </svg>
        </a>
        <a class="social__link" href="https://twitter.com" aria-label="Twitter / X" rel="noopener" target="_blank">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24h-6.66l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.451-6.231zm-1.161 17.52h1.833L7.084 4.126H5.117l11.966 15.644z"/>
          </svg>
        </a>
        <a class="social__link" href="#" aria-label="微信">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8.69 2C4.44 2 1 5.07 1 8.86c0 2.16 1.12 4.08 2.86 5.34L3.1 16.5l2.6-1.3c.9.26 1.84.4 2.81.42-.16-.56-.25-1.15-.25-1.76 0-3.66 3.27-6.62 7.31-6.62.27 0 .53.02.79.05C16.06 3.97 12.7 2 8.69 2zm-2.4 4.2a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2zm4.8 0a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2zm4.97 3.04c-3.5 0-6.34 2.59-6.34 5.78 0 3.2 2.84 5.78 6.34 5.78.75 0 1.46-.12 2.12-.33l2.18 1.1-.6-1.84c1.43-1.05 2.34-2.65 2.34-4.46 0-3.2-2.84-5.78-6.34-5.78zm-2.2 3.2a.84.84 0 1 1 0 1.68.84.84 0 0 1 0-1.68zm4.4 0a.84.84 0 1 1 0 1.68.84.84 0 0 1 0-1.68z"/>
          </svg>
        </a>
        <a class="social__link" href="mailto:hello@nullspace.studio" aria-label="邮件">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M3 7l9 6 9-6"/>
          </svg>
        </a>
      </div>

      <p class="subscribe__hint" style="margin-top: 32px;" data-reveal>
        或直接邮件至 <a href="mailto:hello@nullspace.studio" style="color: var(--c-text); text-decoration: underline; text-underline-offset: 3px;">hello@nullspace.studio</a>
      </p>
    </section>
  </main>

        <a class="footer__link" href="#">用户协议</a>
        <a class="footer__link" href="contact.html">商务合作</a>

    </div>
  </footer>
