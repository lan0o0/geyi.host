  <meta name="keywords" content="联系,商务合作,产品建议,媒体采访,科技工作室" />

  <meta property="og:type" content="website" />

</head>
<body>
  <a class="skip-link" href="#main">跳转到主要内容</a>

  <!-- ===================== Navigation ===================== -->
  <header class="nav" id="nav" data-state="scrolled">
    <div class="nav__inner">
      <a class="nav__logo" href="index.html" aria-label="格一网络 首页">
        <svg class="nav__logo-mark" width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M9 22 L16 9 L23 22" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="nav__logo-text">格一网络</span>
      </a>
      <nav class="nav__links" aria-label="主导航">
        <a class="nav__link" href="index.html">首页</a>
        <a class="nav__link" href="products.html">产品矩阵</a>
        <a class="nav__link" href="about.html">技术理念</a>
        <a class="nav__link" href="about.html#team">关于我们</a>
        <a class="nav__link" href="contact.html">联系我们</a>
      </nav>
      <a class="nav__cta btn btn--ghost" href="index.html#subscribe">订阅动态</a>
      <button class="nav__burger" id="navBurger" aria-label="打开菜单" aria-expanded="false" aria-controls="navMobile">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="nav__mobile" id="navMobile" aria-hidden="true">
      <a class="nav__mobile-link" href="index.html">首页</a>
      <a class="nav__mobile-link" href="products.html">产品矩阵</a>
      <a class="nav__mobile-link" href="about.html">技术理念</a>
      <a class="nav__mobile-link" href="about.html#team">关于我们</a>
      <a class="nav__mobile-link" href="contact.html">联系我们</a>
      <a class="btn btn--solid nav__mobile-cta" href="index.html#subscribe">订阅动态</a>
    </div>
  </header>

  <main id="main">
    <section class="contact">
      <div class="contact__head">
        <p class="subscribe__eyebrow" data-reveal>GET IN TOUCH</p>
        <h1 class="contact__title" data-reveal data-reveal-delay="1">聊聊吧</h1>
        <p class="contact__desc" data-reveal data-reveal-delay="2">
          商务洽谈、产品建议、媒体采访——<br class="hide-sm" />
          告诉我们你的想法,我们会认真回复每一封留言。
        </p>
      </div>

      <form class="form" id="contactForm" novalidate data-reveal data-reveal-delay="2">
        <div class="form__field field">
          <input class="field__input" id="cf-name" name="name" type="text" autocomplete="name" placeholder=" " required />
          <label class="field__label" for="cf-name">姓名</label>
        </div>

        <div class="form__field field">
          <input class="field__input" id="cf-email" name="email" type="email" inputmode="email" autocomplete="email" placeholder=" " required />
          <label class="field__label" for="cf-email">邮箱</label>
        </div>

        <div class="form__field field">
          <textarea class="field__textarea" id="cf-message" name="message" placeholder=" " required></textarea>
          <label class="field__label" for="cf-message">留言</label>
        </div>

        <button class="btn btn--solid form__submit" type="submit">发送留言</button>
      </form>
    </section>
  </main>

  <!-- ===================== Footer ===================== -->
  <footer class="footer" role="contentinfo">
    <div class="footer__inner">
      <div class="footer__left">
        <span class="footer__brand">格一网络</span>
        <span class="footer__copy">© 2026 郑州格一网络科技有限公司. 保留所有权利。</span>
        <!-- ICP 备案号:取得备案号后替换下方 XXXXXXXX -->
        <a class="footer__link" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">豫ICP备XXXXXXXX号</a>
      </div>
      <nav class="footer__right" aria-label="法务链接">
        <a class="footer__link" href="#">隐私政策</a>
        <a class="footer__link" href="#">用户协议</a>
        <a class="footer__link" href="contact.html">商务合作</a>
      </nav>
    </div>
  </footer>

  <script src="js/main.js" defer></script>
</body>
</html>
