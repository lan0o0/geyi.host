<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>支付完成 · 千帆一答</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6f8; color: #1f2329; padding: 24px;
  }
  .card {
    width: 100%; max-width: 480px; background: #fff; border-radius: 16px; padding: 40px 32px;
    box-shadow: 0 8px 32px rgba(0,0,0,.08); text-align: center;
  }
  .icon {
    width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%;
    background: #e8f7ee; color: #1f9d55; display: flex; align-items: center; justify-content: center;
    font-size: 34px; line-height: 1;
  }
  h1 { font-size: 22px; margin: 0 0 12px; font-weight: 600; }
  p { font-size: 15px; line-height: 1.7; color: #646a73; margin: 0 0 8px; }
  .note { font-size: 13px; color: #8f959e; margin-top: 20px; }
  a.btn {
    display: inline-block; margin-top: 24px; padding: 12px 24px; border-radius: 10px;
    background: #1677ff; color: #fff; text-decoration: none; font-size: 15px;
  }
  a.btn:hover { background: #4096ff; }
  @media (prefers-color-scheme: dark) {
    body { background: #16181d; color: #e6e8eb; }
    .card { background: #1f2229; box-shadow: none; }
    .icon { background: #1c2f24; color: #4ade80; }
    p { color: #a5aab3; } .note { color: #7b818b; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>支付已完成</h1>
    <p>本次购买的 AI 辅助时长会在支付成功后自动到账。</p>
    <p>请回到「千帆一答」客户端，余额会自动同步。</p>
    <p class="note">若客户端未及时刷新，稍等片刻或重新打开会员页即可；一般几分钟内到账。</p>
    <a class="btn" href="https://geyi.host/">返回千帆一答官网</a>
  </div>
</body>
</html>
